services:
  isdc-db:
    image: mysql:8.0
    container_name: isdc-mysql
    restart: no
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-isdc_root_2024}
      MYSQL_DATABASE: ${DB_NAME:-isdc_db}
      MYSQL_USER: ${DB_USER:-isdc}
      MYSQL_PASSWORD: ${DB_PASSWORD:-isdc_pass}
      TZ: Asia/Jakarta
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - isdc_mysql_data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-isdc_root_2024}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  isdc_mysql_data:
    driver: local
